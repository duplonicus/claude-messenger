[project]
name = "messenger"
version = "0.1.0"
description = "Local MCP server: send WhatsApp messages and Discord bot DMs from an MCP client such as the Claude app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duplonicus" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    # 1.x FastMCP API; the 2.x line moved things around.
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Tracing is optional: the server runs without these and MESSENGER_TRACES stays off.
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["messenger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
